name: Build Lisa Kernel (Android 17 & HyperOS 4.0)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Lisa A17 Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf libelf-dev libncurses5-dev \
            libssl-dev lz4 liblz4-tool make ninja-build optipng pngquant \
            python3 python-is-python3 rsync squashfs-tools subversion unzip \
            xz-utils zlib1g-dev pahole device-tree-compiler

      - name: Setup Clang Toolchain (AOSP Clang r487747c)
        run: |
          mkdir -p /home/runner/toolchain
          cd /home/runner/toolchain
          echo "[+] Cloning official AOSP Clang toolchain..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r487747c.git clang
          echo "/home/runner/toolchain/clang/bin" >> $GITHUB_PATH

      - name: Clone Kernel Source (SM8350/SM7325 LineageOS Tree)
        run: |
          echo "[+] Cloning Xiaomi SM8350/SM7325 kernel source..."
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git -b lineage-22.1 kernel_src

      - name: Apply Android 17 & HyperOS Patches
        run: |
          chmod +x scripts/patch_config.sh
          # Find defconfigs for lisa / lahaina
          cd kernel_src
          CONFIG_TARGET=""
          for cfg in arch/arm64/configs/vendor/lisa_user_defconfig arch/arm64/configs/vendor/lisa_defconfig arch/arm64/configs/vendor/lahaina-qgki_defconfig; do
            if [ -f "$cfg" ]; then
              CONFIG_TARGET="$cfg"
              break
            fi
          done
          echo "[+] Found target config: $CONFIG_TARGET"
          ../scripts/patch_config.sh "$CONFIG_TARGET"

      - name: Compile Kernel Image & DTBO
        run: |
          cd kernel_src
          export PATH=/home/runner/toolchain/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          echo "[+] Creating output directory and merging configs for Lisa..."
          mkdir -p out
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
            arch/arm64/configs/vendor/lahaina-qgki_defconfig \
            arch/arm64/configs/vendor/xiaomi_QGKI.config \
            arch/arm64/configs/vendor/lisa_QGKI.config

          # Update config with default values for new symbols
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          # Inject A17, Monolithic Display & Storage options directly via scripts/config
          scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_PSI \
            -d CONFIG_MODVERSIONS \
            -d CONFIG_MODULE_SIG \
            -e CONFIG_MODULE_FORCE_LOAD \
            -e CONFIG_SECURITY_SELINUX_DEVELOP \
            -e CONFIG_SCSI_UFSHCD \
            -e CONFIG_SCSI_UFSHCD_PLATFORM \
            -e CONFIG_SCSI_UFS_QCOM \
            -e CONFIG_PHY_QCOM_UFS \
            -e CONFIG_PHY_QCOM_UFS_QMP_V4_LAHAINA \
            -e CONFIG_SCSI_UFS_CRYPTO \
            -e CONFIG_SCSI_UFS_CRYPTO_QTI \
            -e CONFIG_COMMON_CLK_QCOM \
            -e CONFIG_QCOM_SCM \
            --set-str CONFIG_LOCALVERSION "-qgki-g5987d69e25da"
            
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image dtbs

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git package_dir
          cd package_dir
          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Lisa Android 17 & HyperOS 4.0 Kernel by ylmzer
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lisa
          device.name2=2107119DC
          device.name3=2109119DG
          device.name4=2109119DI
          device.name5=Xiaomi 11 Lite 5G NE
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          # boot shell variables
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          dump_boot;
          write_boot;
          ## end boot install

          # Flash certified HyperOS DTBO (Display Panel Timing)
          if [ -f dtbo ]; then
            ui_print "Flashing certified HyperOS DTBO..."
            flash_generic dtbo;
          fi
          EOF
          
          # Copy outputs
          cp ../kernel_src/out/arch/arm64/boot/Image .
          
          # Copy certified HyperOS DTBO
          if [ -f ../dtbo.img ]; then
            cp ../dtbo.img ./dtbo
          elif [ -f ../kernel_src/out/arch/arm64/boot/dtbo.img ]; then
            cp ../kernel_src/out/arch/arm64/boot/dtbo.img ./dtbo
          fi
          
          # Find and copy lisa DTB if available
          LISA_DTB=$(find ../kernel_src/out/arch/arm64/boot/dts -name "*lisa*.dtb" -o -name "*7325*.dtb" | head -n 1)
          if [ -n "$LISA_DTB" ] && [ -f "$LISA_DTB" ]; then
            echo "[+] Found DTB: $LISA_DTB"
            cp "$LISA_DTB" ./dtb
          fi
          
          # Create Flashable ZIP
          zip -r9 ../Lisa_A17_HyperOS4_Kernel.zip * -x .git README.md

      - name: Upload Kernel Artifact

        uses: actions/upload-artifact@v4
        with:
          name: Lisa_A17_HyperOS4_Kernel
          path: |
            Lisa_A17_HyperOS4_Kernel.zip
            kernel_src/out/arch/arm64/boot/Image
            kernel_src/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
